<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - The Bakery</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Admin</div>
      <nav class="nav">
        <a href="/">Menu</a>
        <a href="/kitchen.html">Kitchen</a>
      </nav>
    </header>
    <main class="page grid">
      <section class="panel stack" id="loginPanel">
        <h1>Login</h1>
        <label>Username <input id="username" value="admin"></label>
        <label>Password <input id="password" type="password" value="admin123"></label>
        <button id="login">Login</button>
        <div id="loginMessage" class="message error"></div>
      </section>

      <section class="stack" id="adminPanel" hidden>
        <div class="panel row">
          <div><strong>Today</strong><p class="muted" id="stats">Loading...</p></div>
          <button class="secondary" id="logout">Logout</button>
        </div>

        <form class="panel stack" id="itemForm">
          <h2>Add Menu Item</h2>
          <label>Name <input name="name" required></label>
          <label>Description <textarea name="description" rows="2"></textarea></label>
          <label>Price <input name="price" type="number" min="0" step="0.01" required></label>
          <label>Category <input name="category"></label>
          <label>Image URL <input name="imageUrl" type="url"></label>
          <label>Initial stock <input name="initialInventory" type="number" min="0" value="10"></label>
          <button>Add item</button>
        </form>
      </section>

      <section class="stack" id="itemsPanel" hidden>
        <h2>Menu Items</h2>
        <div id="items" class="stack"></div>
      </section>
    </main>
    <script src="/admin.js"></script>
  </body>
</html>
